<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器中交互查看和旋转三维体积渲染。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>VolVis · 体积渲染</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080a10; color: #e1e7f0; }
    main { width: min(880px, 100%); margin: 0 auto; padding: 80px 24px 48px; }
    .eyebrow { color: #83b6ef; font-size: 13px; letter-spacing: .16em; }
    h1 { margin: 14px 0; font-size: clamp(30px, 6vw, 46px); font-weight: 650; }
    .intro { margin: 0; color: #a9b4c5; line-height: 1.8; }
    .models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 36px 0 28px; }
    .model { display: flex; flex-direction: column; min-height: 210px; padding: 26px;
      border: 1px solid #2a3549; border-radius: 14px; background: #101622;
      color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
    .model:hover { border-color: #83b6ef; background: #151e2d; }
    .model:focus-visible { outline: 3px solid #83b6ef; outline-offset: 5px; }
    .model h2 { margin: 0 0 12px; font-size: 22px; }
    .details { margin: 0 0 24px; color: #a9b4c5; line-height: 1.7; }
    .open { margin-top: auto; color: #9ac6ff; font-weight: 600; }
    .note { color: #8997ac; font-size: 14px; line-height: 1.9; }
    @media (max-width: 600px) { main { padding-top: 44px; } .models { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .model { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VOLVIS</div>
    <h1>交互式体积渲染</h1>
    <p class="intro">选择一个数据集，在浏览器中查看与旋转三维体积。</p>
    <nav class="models" aria-label="选择体积数据集">
      <a class="model" href="Clump.html">
        <h2>Clump</h2>
        <p class="details">体积数据<br>41.7 MiB</p>
        <span class="open">打开模型 <span aria-hidden="true">→</span></span>
      </a>
      <a class="model" href="2890cluster3Core.html">
        <h2>2890 · Cluster 3</h2>
        <p class="details">Core 体积数据<br>45.8 MiB</p>
        <span class="open">打开模型 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
    <p class="note">拖动鼠标旋转，滚轮缩放。<br>较大的数据集首次加载需要一些时间，打开后请稍候。</p>
  </main>
</body>
</html>
